<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Water Guy – Config</title>
  <style>
    body {
      font-family: Arial;
      background: #f0f0f0;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 300px;
      font-family: monospace;
      font-size: 14px;
      padding: 10px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }
    pre {
      color: green;
    }
  </style>
</head>

<body>

<h2>Schedule Config Editor</h2>

<textarea id="configText"></textarea>

<br>
<button onclick="saveConfig()">Save</button>
<button onclick="location.href='/'">Back</button>

<pre id="result"></pre>

<script>
function loadConfig() {
  fetch("/config/data")
    .then(r => r.text())
    .then(t => document.getElementById("configText").value = t)
    .catch(() => document.getElementById("result").innerText = "Failed to load config");
}

function saveConfig() {
  const text = document.getElementById("configText").value;

  fetch("/config", {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: text
  })
  .then(r => r.text())
  .then(t => document.getElementById("result").innerText = t)
  .catch(() => document.getElementById("result").innerText = "Save failed");
}

loadConfig();
</script>

</body>
</html>
